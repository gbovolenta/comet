# COMET example: single-component gas — H2 over an Fe slab at 150 bar, 723 K.
# Run from this directory:  comet run config.yaml
# Provide your own MACE model (model_dir) or switch to energy_backend: orca.

energy_backend: mace                 # "mace" or "orca"
bdir: output/                        # output directory for generated files
model_dir: path/to/mace.model        # MACE model file — provide your own

restart_path: H2_P150bar_T723K.lammpsdata

# `elements` maps each symbol to a LAMMPS atom type by position (1-based):
# [Fe, H] => type 1 = Fe, type 2 = H — must match the restart's Masses section.
elements: [Fe, H]

gas_list: [H2]
gas_template_dir: templates/         # one <species>.xyz per gas

z_cutoff: 15.0          # molecules with COM above this form the gas region 
temperature: 723.0                   # [K]

# Pressure control: total pressure + integer composition ratios (trivial for a
# pure gas). Convergence target = integer molecule count nearest pV/kBT.
pressure: 150.0
ratios:
  H2: 1
pressure_unit: bar

steps: 1000
# seed: 42                           # set for a reproducible run
# log_mu_diagnostics: true           # per-species μ detail in the status lines
