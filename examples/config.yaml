# COMET example configuration
#
# This active example matches the bundled restart file (examples/final.lammps),
# which is an Fe slab + H2 gas system (LAMMPS atom types: 1 = Fe, 2 = H).
# A commented binary N2/H2 variant is shown at the bottom.
#
# You still need to provide your own MACE model and gas templates (see README).

energy_backend: mace                 # "mace" or "orca"
bdir: examples/output/               # Output directory for all generated files
model_dir: path/to/mace.model        # MACE model file — provide your own

restart_path: examples/final.lammps  # LAMMPS data file with Atoms (and Velocities) blocks

# `elements` maps each symbol to a LAMMPS atom type by position (1-based):
#   [Fe, H] => type 1 = Fe, type 2 = H. This MUST match the ordering in your
#   restart file's Masses/Atoms sections.
elements:
  - Fe
  - H

gas_list:                            # Gas species controlled/tracked; any molecular
  - H2                               # formula works (H2, CO, H2O, CH3OH, ...)
gas_template_dir: path/to/templates/ # Directory with one <species>.xyz per gas (e.g. H2.xyz)

# Optional keys (both redundant, kept as consistency checks):
# slab: Fe          # sanity-checked against `elements`; slab atoms are found
#                   # geometrically, so multi-element slabs need no declaration
# gas_masses:       # molecular masses [amu] aligned with gas_list; masses are
#   - 2.01568       # derived from the templates, a mismatch only logs a warning

z_cutoff: 15.14698231002696          # Z cutoff (Å): molecules whose center of mass lies
                                     # above this form the GCMC gas region (whole molecules,
                                     # never split at the boundary)
temperature: 823.0                   # Simulation temperature [K]

# Preferred μ input: per-species partial pressures. Each listed species is
# pressure-controlled toward its own partial pressure. Omit a species (or set it
# to 0) to FREEZE it: it stays in the box and affects the energy/overlap, but is
# never inserted or deleted and is still counted and logged.
partial_pressures:
  H2: 1.0
pressure_unit: bar                   # Unit for pressures: "Pa", "bar", "atm", or "torr"

steps: 1000                          # Number of Monte Carlo steps

# --- GCMC <-> MD cycling (`comet cycle`, mace backend only) --------------------
# Alternates the GCMC loop with ASE-MD (Bussi/CSVR thermostat, frozen bottom
# slab, reflective lid) on the SAME MACE model — one process, no LAMMPS.
# md:
#   n_cycles: 3                      # GCMC <-> MD alternations
#   md_steps: 2000                   # MD steps per cycle
#   timestep_fs: 0.5
#   tau_t_ps: 0.05                   # CSVR time constant
#   freeze_bottom: 2.0               # freeze atoms below (z_min + this) [Å]
#   traj_every: 0                    # extxyz frame interval during MD (0 = off)

# --- Optional controls (defaults shown) ---------------------------------------
# run_until_converged: false         # Loop until all active species hit μ tolerance (uses max_steps)
# max_steps: 1000                    # Step cap when run_until_converged is true
# biased_moves: false                # Bias move direction by Δμ instead of random
# log_mu_diagnostics: false          # Emit per-species target/current μ each step
# log_every: 1                       # Convergence-summary logging interval
# y1: 0.75                           # Mole fraction (only used by the legacy total-pressure fallback)

# --- Legacy fallback (no partial_pressures): total pressure + mole fraction ----
# Remove `partial_pressures` above and instead provide:
# pressure: 1.0
# pressure_unit: bar
# y1: 0.75                           # split for a 2-species binary mixture

# --- Mixture variant (needs a matching restart file + one .xyz per species) ----
# Species are recognized by composition, so any molecular formulas work as long
# as no two species share one (isomers are rejected at load time).
# elements: [Cu, C, O, H]            # type order must match your LAMMPS data file
# gas_list: [CH3OH, H2]
# gas_template_dir: path/to/templates/   # must contain CH3OH.xyz and H2.xyz
# partial_pressures:
#   CH3OH: 0.75
#   H2: 0.25
# pressure_unit: bar

# --- ORCA backend settings (only when energy_backend: orca) -------------------
# orca_method: PBE
# orca_basis: def2-SVP
# orca_nprocs: 1
# orca_charge: 0
# orca_mult: 1
