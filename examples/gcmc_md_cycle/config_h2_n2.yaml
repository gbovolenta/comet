# Binary H2/N2 mixture on Fe — per-species pressure control (template).
# NOTE: `elements` order defines LAMMPS atom types (1=Fe, 2=N, 3=H) and must
# match the seed data file and the MD input's pair_coeff type indices.
energy_backend: mace
bdir: "@BDIR@"
model_dir: "@MODEL@"

restart_path: "@RESTART@"

elements: [Fe, N, H]
gas_list: [H2, N2]
gas_template_dir: "@EXDIR@/templates/"

z_cutoff: 15.14698231002696
temperature: 723.0

pressure: 150.0        # total; ratios 2:1 -> 100 atm H2, 50 atm N2
ratios:                # integer composition; convergence targets preserve 2:1
  H2: 2
  N2: 1
pressure_unit: atm

steps: 10
seed: 42
log_mu_diagnostics: true
